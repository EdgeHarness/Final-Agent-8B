<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
<!-- The mark with no tile behind it, so the tab strip's own colour shows
     through. The art is white on transparent, which would disappear against a
     light tab bar, so it is used as a mask and the ink is filled from the
     browser's theme instead: near-black on a light chrome, near-white on dark.
     A raster favicon cannot do this, which is why the PNG shipped a tile. -->
<style>
  #ink { fill: #0d0d0d; }
  @media (prefers-color-scheme: dark) { #ink { fill: #ececec; } }
</style>
<mask id="a"><image width="128" height="128" href="data:image/png;base64,"/></mask>
<rect id="ink" width="128" height="128" mask="url(#a)"/>
</svg>
